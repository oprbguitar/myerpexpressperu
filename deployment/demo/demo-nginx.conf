server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Demo-Environment "true" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:18081; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; form-action 'self'" always;

  location = /demo-health {
    access_log off;
    default_type text/plain;
  }

  location /demo/ {
    try_files $uri $uri/ /demo/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</body>' '<div role="status" aria-label="Entorno de demostración" style="position:fixed;right:12px;bottom:12px;z-index:2147483647;padding:8px 12px;border-radius:999px;background:#7f1d1d;color:#fff;font:700 12px/1.2 system-ui;box-shadow:0 4px 16px #0004">ENTORNO DE DEMOSTRACIÓN · DATOS FICTICIOS</div></body>';
  }
}

