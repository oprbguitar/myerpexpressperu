name: erp-express-peru
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erp_express
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local_only
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_express"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: erp-local
      MINIO_ROOT_PASSWORD: erp-local-secret-change-me
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 erp-local erp-local-secret-change-me &&
      mc mb --ignore-existing local/erp-private && mc anonymous set none local/erp-private"
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
  migrate:
    build:
      context: .
      dockerfile: deployment/api.Dockerfile
    command: ["pnpm","db:migrate"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: deployment/api.Dockerfile
    env_file: .env
    ports: ["3100:3100"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
  worker:
    build:
      context: .
      dockerfile: deployment/worker.Dockerfile
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    build:
      context: .
      dockerfile: deployment/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:3100/api/v1
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  postgres_data:
  minio_data:
