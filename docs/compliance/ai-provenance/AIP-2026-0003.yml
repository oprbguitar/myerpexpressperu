limitations:
  - >-
    Se modificaron archivos de migración ya aplicados. El runner actual no
    calcula sumas de verificación (schema_migrations solo guarda la versión),
    por lo que el cambio no puede romper una migración aplicada. Hacerlo
    ahora, antes de que exista cualquier mecanismo de checksum, es más seguro
    que hacerlo después. Aun así, es una desviación de la regla de AGENTS.md
    de no editar migraciones aplicadas, y se registra como tal.
