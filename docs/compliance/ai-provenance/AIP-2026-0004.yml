defects_fixed:
  - id: SBOM-1
    description: >-
      El generador de SBOM de la Fase 3 corrompía nombre y versión de los
      paquetes con sufijo de dependencias de pares. pnpm escribe claves como
      "@apideck/better-ajv-errors@0.3.7(ajv@8.20.0)" y el uso del último "@"
      separaba por la dependencia de pares.
    severity: alta
    status: corregido
  - id: SBOM-2
    description: >-
      El generador omitía silenciosamente los paquetes sin dependencias, que
      pnpm escribe como "'pkg@1.0.0': {}". Se perdían 257 de 709 componentes,
      el 36 % del árbol. El SBOM de la Fase 3 estaba incompleto.
    severity: alta
    status: corregido

limitations:
  - >-
    50 componentes del SBOM no declaran licencia: 48 binarios específicos de
    plataforma y fsevents, ninguno instalado en Windows. Un SBOM generado en
    macOS o Linux podría diferir.
  - >-
    El informe de compatibilidad aplica reglas declaradas por familia de
    licencia. No evalúa el escenario concreto de distribución ni sustituye
    asesoría legal.
  - >-
    La clasificación de BlueOak-1.0.0, 0BSD, Python-2.0, CC-BY-4.0 y Zlib la
    realizó esta herramienta, no un abogado. Debe confirmarse.
  - >-
    No se implementó ningún módulo sectorial de la Fase 4. Los pasos 3 a 12
    de la instrucción están pendientes en su totalidad.
  - >-
    Sin revisión humana. Este registro no está aceptado.
